<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Character Stats</title>
    <link rel="stylesheet" href="src/css/style.css" />
    <style>
      body {
        font-family: sans-serif;
        padding: 1rem;
      }

      .character-card {
        border: 1px solid #ccc;
        padding: 1rem;
        border-radius: 8px;
      }

      button {
        margin-top: 1rem;
        padding: 0.5rem 1rem;
      }

      .stat-block {
        background-color: #1f1f1f;
        color: white;
        padding: 1.5rem;
        border-radius: 12px;
        margin-top: 1.5rem;
        font-family: monospace;
      }

      .abilities,
      .saving-throws,
      .senses {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 1rem;
        text-align: center;
      }

      @media (min-width: 768px) {
        .abilities {
          grid-template-columns: repeat(6, 1fr);
        }
        .saving-throws,
        .senses {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      /* Modern stat box styling */
      #abilities .stat-box {
        height: 65px; /* your desired height */
        display: flex;
        flex-direction: column;
        justify-content: center; /* vertically center */
        align-items: center; /* horizontally center, if needed */
        padding-top: 5px;
      }

      #savingThrows .stat-box {
        height: auto; /* or just omit this to keep default for saving throws */
      }

      .stat-box {
        background: linear-gradient(145deg, #2a2a2a, #1a1a1a);
        padding: 1.25rem;
        border-radius: 12px;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.6);
        border: 1px solid #444;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        text-align: center;
      }

      .stat-box:hover {
        transform: scale(1.03);
        box-shadow: 0 4px 12px rgba(255, 215, 0, 0.3);
      }

      .stat-box .score {
        position: relative;
        padding-top: 0.5em; /* Reserve space above for the star */
      }

      .stat-box .score .prof-star {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        font-size: 0.8em;
        line-height: 0em;
        color: gold;
        user-select: none;
      }

      .score {
        font-size: 1.75rem;
        font-weight: 700;
        color: #f6c90e;
      }

      .mod {
        font-size: 1.25rem;
        color: #ccc;
        margin-top: 0.25rem;
      }

      .label {
        font-size: 0.85rem;
        color: #aaa;
        text-transform: uppercase;
        margin-top: 0.5rem;
        letter-spacing: 0.5px;
      }

      .section h3 {
        text-transform: uppercase;
        font-size: 1rem;
        margin-bottom: 0.5rem;
        letter-spacing: 1px;
      }

      .notes {
        font-size: 0.9rem;
        color: #90ee90;
        margin-top: 0.5rem;
      }

      .darkvision {
        text-align: center;
        font-size: 0.875rem;
        margin-top: 0.5rem;
        color: #ccc;
      }

      hr {
        border: none;
        border-top: 2px solid #e0b400;
        margin: 1.5rem 0;
      }
    </style>
  </head>
  <body>
    <div class="character-card">
      <h2 id="char-name">Character Name</h2>
      <div id="stats">Loading stats...</div>
      <div class="stat-block">
        <!-- Ability Scores -->
        <div class="abilities" id="abilities"></div>

        <hr />

        <!-- Saving Throws -->
        <div class="section">
          <h3>Saving Throws (🟊 = Proficient)</h3>
          <div class="saving-throws" id="savingThrows"></div>
          <div class="notes"></div>
        </div>

        <hr />
      </div>
      <button id="closeBtn">Close</button>
    </div>
    <script type="module" src="src/js/charStats.js"></script>
  </body>
</html>
