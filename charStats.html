<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Character Stats</title>
    <!-- <link rel="stylesheet" href="src/css/style.css" /> -->
    <link rel="stylesheet" href="src/css/charStats.css" />
  </head>
  <body>
    <div class="character-card">
      <div id="char-name" class="char-name">Character Name</div>
      <div id="stats">Loading stats...</div>
      <div class="stat-block">
        <h3>Ability Checks</h3>
        <!-- Ability Scores -->
        <div class="abilities" id="abilities"></div>

        <hr />

        <!-- Saving Throws -->
        <div class="section">
          <h3>Saving Throws (🟊 = Proficient)</h3>
          <div class="saving-throws" id="savingThrows"></div>
          <div class="notes"></div>
        </div>

        <hr />
      </div>
      <button id="closeBtn">Close</button>
    </div>
    <script type="module" src="src/js/charStats.js"></script>
  </body>
</html>
