<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App</title>
    <link rel="stylesheet" href="src/css/style.css" />
  </head>
  <body>
    <!-- Tab headers -->
    <div class="tabs">
<div class="tab active" data-tab="details-tab" id="details-tab-label">Character's</div>
      <div class="tab" data-tab="main-tab">Settings</div>
      <!-- <div class="tab" data-tab="extras-tab">Extras</div> -->
      <!-- NEW tab -->
    </div>

    <!-- Character Details tab (default active) -->
    <div id="details-tab" class="tab-content active">
      <div id="character-details-container"></div>
    </div>

    <!-- Main tab content -->
    <div id="main-tab" class="tab-content">
        <div><p><h3>GM Settings</h3></div></p>
        <div id="settings-content">
          <label for="openActionSetting">Extension Auto Open:</label>
          <input type="checkbox" id="openActionSetting" />

          <label for="showInspirationSetting">Show Inspiration:</label>
          <input type="checkbox" id="showInspirationSetting" />
                <div class="button"><br><br>
        </button>
              </div>

        <label for="detailsTabLabelSetting">Set Group Name Here:<br><br></label>
        <input type="text" id="detailsTabLabelSetting" placeholder="Character's" />
<br><br>
        <button id="usageButton" type="button">Usage Guide</button>
        </div>
      </div>

      <!-- Main app logic -->
      <script type="module" src="/src/js/main.js"></script>
    </div>

    <!-- New Extras tab -->
    <div id="extras-tab" class="tab-content">
      <div id="extras-container">
        <h3>Extras</h3>
        <!-- Add anything you want here -->
        <p>This tab is ready for new content.</p>
      </div>
    </div>

    <!-- Tab switching script -->
    <script>
      document.querySelectorAll(".tab").forEach((tab) => {
        tab.addEventListener("click", () => {
          document
            .querySelectorAll(".tab")
            .forEach((t) => t.classList.remove("active"));
          document
            .querySelectorAll(".tab-content")
            .forEach((c) => c.classList.remove("active"));

          tab.classList.add("active");
          document
            .getElementById(tab.getAttribute("data-tab"))
            .classList.add("active");
        });
      });
    </script>
  </body>
</html>
