<!-- rollResult.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roll Result</title>
    <link rel="stylesheet" href="/src/css/rollResult.css" />
    <script type="module" src="/src/js/rollUtils.js"></script>
  </head>
  <body class="roll-body">
    <div class="roll-container">
      <div id="name-label" class="roll-header"></div>
      <pre id="result" class="roll-output"></pre>
    </div>
    <script>
      const params = new URLSearchParams(window.location.search);
      const label = params.get("label") || "Roll";
      const content = params.get("content") || "No result";
      const name = params.get("name") || "Unknown";

      document.getElementById(
        "name-label"
      ).innerHTML = `<div>${name}</div><div>${label}</div>`;
      document.getElementById("result").innerHTML = content;

      // Trigger fizzle-out at 4 seconds, popover closes at 5
      setTimeout(() => {
        document.body.classList.add("fizzle-out");
      }, 3500);
    </script>
  </body>
</html>
